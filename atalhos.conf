#####################################################################
## Utilitarios
#####################################################################

# Terminal
    bindsym $mod+t exec $term

# Fechar janela
    bindsym $mod+q kill

# Launcher
    bindsym $mod+space exec --no-startup-id $menu -show run

# Reload config
    bindsym $mod+c reload

# Screenshot
    bindsym $mod+Shift+s exec maim ~/Imagens/screenshot-$(date +%s).png


# mode
    ## Move um container
    bindsym $mod+m mode "Move"

    ## Modifica o tamanho do container
    bindsym $mod+r mode "Resize"



#####################################################################
## Áudio
#####################################################################

bindsym XF86AudioMute exec pactl set-sink-mute @DEFAULT_SINK@ toggle
bindsym XF86AudioLowerVolume exec pactl set-sink-volume @DEFAULT_SINK@ -5%
bindsym XF86AudioRaiseVolume exec pactl set-sink-volume @DEFAULT_SINK@ +5%
bindsym XF86AudioMicMute exec pactl set-source-mute @DEFAULT_SOURCE@ toggle



#####################################################################
## Janelas e Workspace
#####################################################################

# Variáveis
    bindsym $mod+$up focus up
    bindsym $mod+$right focus right
    bindsym $mod+$down focus down
    bindsym $mod+$left focus left

    bindsym $mod+Shift+$right workspace next
    bindsym $mod+Shift+$left workspace prev
    
    
# Teclas
    bindsym $mod+Up focus up
    bindsym $mod+Right focus right
    bindsym $mod+Down focus down
    bindsym $mod+Left focus left
    
    bindsym $mod+f fullscreen toggle
    bindsym $mod+h layout toggle split
    bindsym $mod+v layout toggle split
    bindsym $mod+Shift+space layout stacking

    bindsym $mod+Shift+Escape move scratchpad
    bindsym $mod+Escape scratchpad show

    bindsym $mod+Shift+Right workspace next
    bindsym $mod+Shift+Left workspace prev

    bindsym $mod+1 workspace $w1
    bindsym $mod+2 workspace $w2
    bindsym $mod+3 workspace $w3
    bindsym $mod+4 workspace $w4
    bindsym $mod+5 workspace $w5
    bindsym $mod+6 workspace $w6
    bindsym $mod+7 workspace $w7
    bindsym $mod+8 workspace $w8
    bindsym $mod+9 workspace $w9
    bindsym $mod+0 workspace $w0
    


#####################################################################
## Modos
#####################################################################

mode "Move" {
    ## Variáveis
    bindsym $up move up
    bindsym $right move right
    bindsym $left move left
    bindsym $down move down

    bindsym $mod+Shift+$right move container to workspace next
    bindsym $mod+Shift+$left move container to workspace prev


    ## Teclas
    bindsym Up move up
    bindsym Right move right
    bindsym Down move down
    bindsym Left move left

    bindsym $mod+Shift+Right move container to workspace next
    bindsym $mod+Shift+Left move container to workspace prev

    bindsym $mod+1 move container to workspace $w1
    bindsym $mod+2 move container to workspace $w2
    bindsym $mod+3 move container to workspace $w3
    bindsym $mod+4 move container to workspace $w4
    bindsym $mod+5 move container to workspace $w5
    bindsym $mod+6 move container to workspace $w6
    bindsym $mod+7 move container to workspace $w7
    bindsym $mod+8 move container to workspace $w8
    bindsym $mod+9 move container to workspace $w9
    bindsym $mod+0 move container to workspace $w0

    bindsym $mod+m mode "default"
    bindsym Return mode "default"
    bindsym Escape mode "default"
}



mode "Resize" {
    ## Variáveis
    bindsym $up resize grow height 10px
    bindsym $right resize grow width 10px
    bindsym $down resize shrink height 10px
    bindsym $left resize shrink width 10px

    ## Teclas
    bindsym Up resize grow height 10px
    bindsym Right resize grow width 10px
    bindsym Down resize shrink height 10px
    bindsym Left resize shrink width 10px

    bindsym $mod+r mode "default"
    bindsym Return mode "default"
    bindsym Escape mode "default"
}
