# Wallpaper
exec_always --no-startup-id feh --bg-fill ~/Imagens/wallpaper.png


# Notify
exec --no-startup-id dunst


# i3-bar
font pango:monospace 10

bar {
    position top

    status_command while date +'%Y-%m-%d %X'; do sleep 1; done

    colors {
        statusline #ffffff
        background #323232
        inactive_workspace #32323200 #32323200 #5c5c5c
    }
}
